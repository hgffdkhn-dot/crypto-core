# Nginx 反向代理配置：终止 TLS，把 HTTP/WebSocket 转发给本机 8080 的 EnChat 服务。
#
# 使用：
#   sudo cp deploy/nginx-enchat.conf /etc/nginx/sites-available/enchat
#   sudo ln -s /etc/nginx/sites-available/enchat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 说明：EnChat 在 TLS 之上还有一层应用层信封加密（X25519 + Ed25519 签名 + AES-GCM），
# 且客户端会 pinning 服务器长期公钥。但 TLS 这层仍然必须有：
#   1. 防止握手元数据泄露（谁在连、什么时候连）
#   2. 防止运营商/公共 WiFi 的明文劫持与内容注入
#   3. 提供标准的服务器身份认证（pinning 是第二道，不是替代品）

upstream enchat_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name server.servebeer.com;

    # ACME 校验（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 不启用 HTTP/2：nginx 不支持 RFC 8441，HTTP/2 禁止 Connection/Upgrade 头，
    # 会让 WebSocket 握手直接 400（表现为 App 一直「连接中…」但 REST 正常）。
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name server.servebeer.com;

    ssl_certificate     /etc/letsencrypt/live/server.servebeer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.servebeer.com/privkey.pem;

    # 仅 TLS 1.2+；禁用已被攻破的旧套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;

    # 头像与文件下载：限 10 MB，超出直接拒绝
    client_max_body_size 10m;

    # ---------- WebSocket ----------
    # 这三条是必须的。少了 Upgrade 头，WebSocket 会以 400/426 失败，
    # 表现为客户端一直显示「连接中…」。
    location /ws {
        proxy_pass http://enchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 是长连接，超时必须放大。默认 60s 会导致空闲连接被切断。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---------- REST + 健康检查 ----------
    location / {
        proxy_pass http://enchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 注册/登录要做 Argon2id 派生（64 MiB / t=3），响应偏慢属正常
        proxy_read_timeout 60s;
    }
}
