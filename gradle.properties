# JVM：CI 的 2 核 runner 上默认堆容易 OOM/GC 抖动，显式给足
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# 只配置被任务实际用到的模块：构建 :crypto-core / :server 时不去配置 :app
# （:app 需要 Android Gradle Plugin，配置阶段就要找 Android SDK）。
# 这样在没有 Android SDK 的机器上也能跑 JVM 模块的构建与测试。
org.gradle.configureondemand=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
