name: CI

on:
  push:
    branches: [main, develop]
    # ⚠️ 必须显式监听 tag。
    # 只写 branches 的话，即使 git push --tags，工作流也**根本不会启动**，
    # 于是 server-dist 的 startsWith(github.ref,'refs/tags/v') 永远不成立。
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  # 允许在 Actions 页面手动点 "Run workflow"，不必打 tag 也能产出服务端分发包
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto-core:
    name: Build & test crypto-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 仓库未提交 gradle-wrapper.jar，因此显式安装 Gradle。
      # 若你偏好 wrapper：本地执行 `gradle wrapper --gradle-version 8.9` 后，
      # 可把本步骤替换为 `chmod +x ./gradlew` 并把 gradle 命令换成 ./gradlew。
      - name: Set up Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o -d /opt /tmp/gradle.zip
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build and test
        run: gradle :crypto-core:build --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-core-test-report
          path: crypto-core/build/reports/tests/test
          if-no-files-found: ignore

  client-core:
    name: Build & test client-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o -d /opt /tmp/gradle.zip
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build and test
        run: gradle :client-core:build --no-daemon --console=plain

  server:
    name: Build & test server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o -d /opt /tmp/gradle.zip
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 集成测试用 H2 内存库，不需要外部数据库服务。
      # 但它会真实绑定一个随机端口，Runner 需允许本机回环监听（GitHub-hosted 默认允许）。
      - name: Build and test
        run: gradle :server:test --no-daemon --console=plain

      - name: Upload server test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test
          if-no-files-found: ignore

  # 发布服务端可执行包（仅在打 tag 时构建产物，不做部署）
  server-dist:
    name: Build server distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [crypto-core, server]
    # 打 v* tag 时自动跑；也可在 Actions 页面手动触发（workflow_dispatch）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o -d /opt /tmp/gradle.zip
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle

      - name: Build distribution
        run: gradle :server:installDist --no-daemon --console=plain

      # 打一个 tar.gz：下载后 scp 到服务器直接解压即可，不用再手动整理目录
      - name: Package distribution
        run: |
          set -eu
          VER="${GITHUB_REF_NAME:-dev}"
          tar czf "enchat-server-${VER}.tar.gz" -C server/build/install/server .
          ls -lh "enchat-server-${VER}.tar.gz"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: enchat-server-dist
          path: |
            server/build/install/server
            enchat-server-*.tar.gz
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [crypto-core, client-core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⚠️ 必须用 v4（或给 v3 显式传 packages）。
      # v3 的 packages 默认值是 `tools platform-tools`，而 Google 已把 legacy `tools` 包
      # 从 SDK 仓库下架，新版 cmdline-tools 下 sdkmanager 直接以退出码 1 失败：
      #   Warning: Failed to find package 'tools'
      # v4 的默认值已移除 tools，且显式请求时也只告警不再失败。
      # 这里再显式声明一次 packages，双保险。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 显式安装编译所需的 platform / build-tools。
      # 两个易踩的坑：
      #  1. 包名里的分号 `;` 是 shell 元字符，不加引号会被拆成两条命令 → Failed to find package 'platforms'
      #  2. 不要再用 `yes | sdkmanager --licenses`：新版 sdkmanager 已废弃该参数（"no longer needed"），
      #     且在 `set -eo pipefail` 下 `yes |` 会因 SIGPIPE 返回 141
      - name: Install Android platform and build-tools
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SM" ]; then echo "::error::sdkmanager not found under $SDK"; exit 1; fi
          echo "sdkmanager: $SM"
          "$SM" --install "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o -d /opt /tmp/gradle.zip
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ⚠️ 关键预检：源码文件若被 .gitignore 静默排除，CI 检出后不会有任何提示，
      # 只会表现为整包 "Unresolved reference"（曾因 .gitignore 里的裸 `data/` 模式踩过）。
      # 这里显式列出必须存在的源文件，缺失就立刻失败并给出可复制的排查命令。
      - name: Verify all source files are present (not gitignored)
        run: |
          set -eu
          MISSING=0
          for f in \
            app/src/main/java/com/enchat/app/data/SettingsStore.kt \
            app/src/main/java/com/enchat/app/data/KeystoreVault.kt \
            app/src/main/java/com/enchat/app/data/local/Entities.kt \
            app/src/main/java/com/enchat/app/data/local/Dao.kt \
            app/src/main/java/com/enchat/app/data/local/AppDatabase.kt \
            app/src/main/java/com/enchat/app/data/remote/ApiClient.kt \
            app/src/main/java/com/enchat/app/data/remote/WsClient.kt \
            app/src/main/java/com/enchat/app/data/remote/Json.kt \
            app/src/main/java/com/enchat/app/repo/ChatRepository.kt \
            app/src/main/java/com/enchat/app/di/AppContainer.kt \
            app/src/main/AndroidManifest.xml ; do
            if [ ! -f "$f" ]; then echo "::error::缺少源文件 $f"; MISSING=1; fi
          done
          if [ "$MISSING" != "0" ]; then
            echo ""
            echo "这些文件存在于工作区但没有被提交 —— 多半被 .gitignore 排除了。排查："
            echo "  git check-ignore -v app/src/main/java/com/enchat/app/data/SettingsStore.kt"
            echo "  git ls-files app/src/main/java/com/enchat/app/data/"
            echo "修好后重新提交：git add -A && git commit"
            exit 1
          fi
          echo "源码文件齐全"

      # Debug 构建使用占位公钥即可编译通过；
      # 若要产出可连真实服务器的 APK，请用仓库密钥注入 SERVER_*_PUB_B64。
      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/android-build.log

      # Kotlin 按文件顺序列出错误，而 `data/` 排在 `ui/` 之前 —— 真正的根因往往在
      # 日志最前面，容易被 Gradle 的失败摘要顶掉。这里固定打印前 60 条。
      - name: Print first Kotlin errors (root cause is usually at the top)
        if: failure()
        run: |
          echo '======== 前 60 条 Kotlin 错误（根因通常在最前面） ========'
          grep -E '^e: ' /tmp/android-build.log | head -60 || true
          echo '======== 非 Kotlin 错误（依赖解析 / kapt / AGP） ========'
          grep -E '^(w: |FAILURE|\* What went wrong|Could not |Failed to )' /tmp/android-build.log | head -40 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enchat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
